packages:
  - "apps/*"
  - "packages/*"
  - "extensions/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.12"
  - "@turbo/darwin-arm64@2.11.12"
  - "@turbo/linux-64@2.11.12"
  - "@turbo/linux-arm64@2.11.12"
  - "@turbo/windows-64@2.11.12"
  - "@turbo/windows-arm64@2.11.12"
  - turbo@2.11.12
